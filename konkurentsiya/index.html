<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Конкуренция</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: биржевое табло сверху (тикер компаний), под ним одна рабочая колонка-«пульт» с боковой сводкой. */
:root{
  --bg:#eef1f4; --surface:#fbfcfd; --sunken:#e4e9ee; --ink:#14202e; --muted:#566373; --line:#d3dae2;
  --accent:#17324d; --on-accent:#f4f8fb; --good:#17794a; --bad:#c23434; --warn-bg:#fff1cf; --warn-ink:#6b4a00;
  --s0:#2a78d6; --s1:#eb6834; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4; --s5:#008300; --s6:#6250d6; --s7:#e34948;
  --display:"Unbounded","Arial Black",sans-serif; --body:"Golos Text","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#18212b; --sunken:#111a23; --ink:#e9eef3; --muted:#9aa7b5; --line:#2b3744;
  --accent:#dce7f1; --on-accent:#10202f; --good:#45c486; --bad:#f07777; --warn-bg:#3a2f10; --warn-ink:#f3d58a;
  --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181; --s5:#0ca30c; --s6:#9085e9; --s7:#e66767; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#18212b; --sunken:#111a23; --ink:#e9eef3; --muted:#9aa7b5; --line:#2b3744;
  --accent:#dce7f1; --on-accent:#10202f; --good:#45c486; --bad:#f07777; --warn-bg:#3a2f10; --warn-ink:#f3d58a;
  --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181; --s5:#0ca30c; --s6:#9085e9; --s7:#e66767; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(28px,6vw,52px);font-weight:700;letter-spacing:-.02em}
h2{font-size:20px;font-weight:500}
h3{font-size:14px;font-weight:500}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font:700 15px/1 var(--display);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{display:inline-flex;gap:3px}.brand i b{width:6px;border-radius:2px;display:block}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}

button{font:600 15px/1 var(--body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);padding:14px 22px;font-size:16px}
button.primary:hover{opacity:.9}
button.ghost{background:transparent}
button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--s0);outline-offset:2px}

/* табло */
.ticker{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.tick{flex:1 1 150px;min-width:0;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.tick .nm{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;min-width:0}
.tick .nm span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick .v{font:600 17px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.tick .d{font:400 12px/1 var(--mono)}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.tag{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 4px;flex:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.event{border:1px dashed var(--muted);border-radius:12px;padding:14px 18px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.event b{font-family:var(--display);font-weight:500;font-size:15px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12px;color:var(--muted)} .stat .val{font:600 17px/1.2 var(--mono);font-variant-numeric:tabular-nums}

.field{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.field:last-of-type{border-bottom:0;padding-bottom:0}
.field .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.field label{font-weight:600}
.field output{font:600 17px/1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--s0);height:28px;margin:0}
input[type=text]{font:500 16px/1 var(--body);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}

.ledger{display:flex;flex-direction:column;gap:7px;font-size:14px}
.ledger div{display:flex;justify-content:space-between;gap:12px}
.ledger div span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger .sum{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 12px;font-size:14px}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font:600 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-family:var(--body);font-weight:600}
.nmc{display:inline-flex;align-items:center;gap:8px}
tr:last-child td{border-bottom:0}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;font-size:14px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{font:11px var(--mono);fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;white-space:nowrap;z-index:5}
.tip .dot{margin-right:6px}
.share{display:flex;gap:2px;height:34px}
.share div{border-radius:4px;min-width:3px;display:flex;align-items:center;justify-content:center;font:600 12px/1 var(--mono);color:#fff;overflow:hidden}
.share div.dk{color:#0b0b0b}

.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.hero{display:flex;flex-direction:column;gap:14px;padding-block:12px}
.hero p{max-width:62ch;font-size:17px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.rules div{display:flex;flex-direction:column;gap:6px;font-size:14px}
.podium{display:flex;flex-direction:column;gap:8px}
.podium .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.podium .row:first-child{border-color:var(--ink);border-width:2px}
.podium .pl{font:700 20px/1 var(--display);width:34px}
.podium .who{flex:1 1 160px;min-width:0;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:70ch}
.center{align-items:center;text-align:center;padding-block:48px}
.row-btn{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);max-width:min(760px,calc(100vw - 32px));padding:22px}
dialog::backdrop{background:rgba(8,14,20,.55)}
@media (prefers-reduced-motion:no-preference){.share div{transition:flex-grow .5s}}

textarea{font:400 16px/1.4 var(--body);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-height:84px;resize:vertical}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.roles button{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:22px;border-radius:12px;font-weight:400;line-height:1.4}
.roles button b{font:500 20px/1.2 var(--display)}
.code{font:700 clamp(28px,7vw,44px)/1 var(--mono);letter-spacing:.12em}
.chip{font:600 12px/1 var(--mono);border-radius:20px;padding:5px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{border-color:var(--good);color:var(--good)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.teamrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.teamrow .t{flex:1 1 90px;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teamrow button{padding:7px 10px;font-size:13px}
.inits{display:flex;flex-direction:column;gap:8px}
.inits label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:400}
.inits input{margin-top:4px;accent-color:var(--s0);width:18px;height:18px;flex:none}
.inits b{font-weight:600}
.banner{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--warn-bg);color:var(--warn-ink)}
.timer{font:700 28px/1 var(--mono);font-variant-numeric:tabular-nums}
.sharelbl{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
details>summary{cursor:pointer;font-weight:600}
.quote{border-left:3px solid var(--line);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px}
.qbox{background:var(--sunken);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
</style>
</head><body>
<div class="wrap">
  <div class="top">
    <div class="brand"><i><b style="height:10px;background:var(--s0)"></b><b style="height:16px;background:var(--s1)"></b><b style="height:13px;background:var(--s2)"></b><b style="height:20px;background:var(--s3)"></b></i>КОНКУРЕНЦИЯ</div>
    <div class="acts"><span class="chip" id="rolechip" hidden></span><button class="ghost" id="btn-rules" type="button">Правила</button><button class="ghost" id="btn-new" type="button" hidden>Выйти</button></div>
  </div>
  <div id="app"></div>
</div>
<dialog id="dlg-rules"><div id="rules-body"></div><div class="row-btn" style="margin-top:18px"><button type="button" id="btn-rules-close">Понятно</button></div></dialog>
<dialog id="dlg-new"><h2 id="dlg-new-h">Выйти?</h2><p class="muted" style="margin-top:8px" id="dlg-new-p"></p><div class="row-btn" style="margin-top:18px"><button type="button" class="primary" id="btn-new-yes">Да</button><button type="button" id="btn-new-no">Остаться</button></div></dialog>

<script>
"use strict";
/* ================= ДВИЖОК РЫНКА ================= */
const CFG={P0:500,base:1000,growth:1.02,capCost:150,capValue:100,fixed:60000,fixedPerCap:40,storage:20,rate:0.03,maxDebt:500000,penalty:0.08,startCash:450000,startCap:1200,research:20000};
const SEG={eco:{n:'Эконом',w:.6,eP:4,eQ:.7,eB:.4},prem:{n:'Премиум',w:.4,eP:1.6,eQ:2.2,eB:.9}};
const INIT={
  auto:{n:'Автоматизация линии',cost:120000,d:'Себестоимость самоката ниже на $25 навсегда.'},
  service:{n:'Сервисная сеть',cost:90000,d:'Бренд теряет 15% за квартал вместо 25%.'},
  online:{n:'Интернет-магазин',cost:70000,d:'На 15% больше покупателей в сегменте «Эконом».'}};
const EVENTS={
  calm:{t:'Спокойный квартал',d:'Рынок без сюрпризов. Спрос растёт своим темпом.'},
  boom:{t:'Бум спроса',d:'Город открыл новые велодорожки. Оба сегмента больше на 25%.',demand:1.25},
  slump:{t:'Спад спроса',d:'Дождливый сезон. Оба сегмента меньше на 20%.',demand:0.8},
  parts:{t:'Подорожали комплектующие',d:'Аккумуляторы выросли в цене. Себестоимость самоката выше на 12%.',cost:1.12},
  thrift:{t:'Покупатели считают деньги',d:'«Эконом» вырос на 10% и стал чувствительнее к цене. «Премиум» сжался на 15%.',eP:1.3,eco:1.1,prem:.85},
  quality:{t:'Мода на качество',d:'Вышел громкий обзор надёжности. «Премиум» больше на 30%, качество весит сильнее.',eQ:1.3,prem:1.3},
  noise:{t:'Рекламный шум',d:'Выборы заняли все площадки. Отдача от маркетинга ниже на 40%.',mkt:0.6},
  cheap:{t:'Дешёвые кредиты',d:'Банки снизили ставку. Проценты по долгу в этом квартале вдвое ниже.',rate:0.5},
  import:{t:'Дешёвый импорт',d:'На маркетплейсах появились самокаты без бренда. «Эконом» для местных компаний меньше на 18%.',eco:.82},
  season:{t:'Высокий сезон',d:'Тёплая погода. Оба сегмента больше на 12%.',demand:1.12}
};
const evOf=id=>Object.assign({demand:1,cost:1,eP:1,eQ:1,mkt:1,rate:1,eco:1,prem:1},EVENTS[id]);
const STYLES={disc:{n:'Дискаунтер',p:.93,m:35000,r:12000,about:'низкая цена, минимум вложений'},bal:{n:'Середняк',p:1,m:60000,r:35000,about:'средняя цена, ровные вложения'},prem:{n:'Премиум',p:1.12,m:65000,r:55000,about:'высокая цена, ставка на качество и бренд'}};
const BOT_NAMES=['Вектор','Молния','Пилигрим'];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const unitCost=(c,ev)=>(220+10*c.q-(c.has.auto?25:0))*ev.cost;
const fixedCost=c=>CFG.fixed+CFG.fixedPerCap*c.cap;
const startValue=()=>CFG.startCash+CFG.startCap*CFG.capValue;

function newGame(humanNames,bots,rounds){
  const cos=[], styles=['bal','disc','prem'], n=humanNames.length+bots;
  for(let i=0;i<n;i++){
    const human=i<humanNames.length, b=i-humanNames.length;
    cos.push({name:human?humanNames[i]:BOT_NAMES[b%3],human,style:human?null:styles[b%3],ci:i,
      cash:CFG.startCash,debt:0,cap:CFG.startCap,pendCap:0,inv:0,avgCost:250,q:3,brand:50,botPrice:null,has:{},hist:[]});
  }
  let code='';for(let i=0;i<4;i++)code+='ABCDEFGHKLMNPRSTUVXYZ'[Math.floor(Math.random()*21)];
  return {v:2,code,phase:'decide',round:1,rounds,eventId:'calm',cos,decs:[],src:[],deadline:0,chart:'value',ts:Date.now()};
}
function lastDec(c){
  const h=c.hist[c.hist.length-1];
  if(h) return {price:h.price,prod:Math.min(h.prod,c.cap),mkt:h.mkt,rd:h.rd,newCap:0,loan:0,buy:[],research:false};
  return {price:500,prod:1000,mkt:50000,rd:30000,newCap:0,loan:0,buy:[],research:false};
}
function botDec(c,S){
  const ev=evOf(S.eventId), st=STYLES[c.style], h=c.hist[c.hist.length-1], uc=unitCost(c,ev);
  const target=CFG.P0*st.p+(c.q-3)*(c.style==='prem'?26:14);
  if(c.botPrice==null) c.botPrice=target;
  if(h){
    if(h.lost>20) c.botPrice*=1.04;
    else if(h.inv>0.25*Math.max(h.sales,1)) c.botPrice*=0.955;
    c.botPrice+=(target-c.botPrice)*0.15;
  }
  c.botPrice=clamp(c.botPrice,uc*1.18,700);
  const price=Math.round(clamp(c.botPrice*(0.98+Math.random()*0.04),300,700)/5)*5;
  const expected=(h?h.demand/h.evDemand:CFG.base)*ev.demand*(h&&h.price?Math.pow(price/h.price,-2):1);
  const poor=c.cash<90000?0.5:1, last=S.round===S.rounds;
  const prod=clamp(Math.round((expected*1.07-c.inv)/10)*10,0,c.cap);
  let loan=0; const need=prod*uc+fixedCost(c)+st.m*poor+st.r*poor;
  if(c.cash<need*0.6&&c.debt<400000) loan=100000;
  else if(c.cash>380000&&c.debt>0) loan=-Math.min(Math.ceil(c.debt/10000)*10000,100000);
  const newCap=(!last&&expected>0.9*(c.cap+c.pendCap)&&c.cash>260000)?200:0;
  const buy=[]; const want={disc:['auto','online'],bal:['auto','service'],prem:['service','auto']}[c.style].find(k=>!c.has[k]);
  if(want&&S.round>=2&&S.round<S.rounds-1&&c.cash>need+INIT[want].cost+60000) buy.push(want);
  return {price,prod,mkt:st.m*poor,rd:last?st.r*0.3:st.r*poor,newCap,loan,buy,research:false};
}
function mkRow(c,d,ev){
  const price=clamp(+d.price||500,300,700), prod=clamp(Math.round(+d.prod||0),0,c.cap), mkt=clamp(+d.mkt||0,0,200000), rd=clamp(+d.rd||0,0,150000), newCap=clamp(+d.newCap||0,0,600);
  let loan=+d.loan||0; loan=loan<0?-Math.min(-loan,c.debt):Math.min(loan,Math.max(0,CFG.maxDebt-c.debt));
  const buy=(d.buy||[]).filter(k=>INIT[k]&&!c.has[k]);
  const uc=unitCost(c,ev), brand=clamp(c.brand*(c.has.service?0.85:0.75)+12.5*Math.sqrt(mkt*ev.mkt/50000),5,100), avail=c.inv+prod, A={};
  for(const k in SEG){const s=SEG[k];A[k]=Math.pow(price/CFG.P0,-s.eP*ev.eP)*Math.pow(c.q/3,s.eQ*ev.eQ)*Math.pow(brand/50,s.eB)*(k==='eco'&&c.has.online?1.15:1);}
  return {c,price,prod,mkt,rd,newCap,loan,buy,research:!!d.research,uc,brand,avail,A,d:{}};
}
function demandCalc(R,ev,t){
  const N=R.length;
  for(const k in SEG){
    const sumA=R.reduce((s,r)=>s+r.A[k],0), wP=R.reduce((s,r)=>s+r.A[k]*r.price,0)/sumA, avgB=R.reduce((s,r)=>s+r.brand,0)/N;
    const D=CFG.base*N*SEG[k].w*Math.pow(CFG.growth,t-1)*ev.demand*ev[k]*Math.pow(wP/CFG.P0,-0.6)*Math.pow(avgB/50,0.25);
    R.forEach(r=>r.d[k]=D*r.A[k]/sumA);
  }
  R.forEach(r=>r.demand=Math.round(r.d.eco+r.d.prem));
}
function forecast(S,idx,dec){
  const ev=evOf(S.eventId), R=S.cos.map((c,i)=>mkRow(c,i===idx?dec:lastDec(c),ev)); demandCalc(R,ev,S.round); return R[idx];
}
function playRound(S,decs){
  const ev=evOf(S.eventId), t=S.round;
  const R=S.cos.map((c,i)=>mkRow(c,decs[i]||lastDec(c),ev));
  demandCalc(R,ev,t);
  R.forEach(r=>{r.sales=Math.min(r.demand,r.avail);r.lost=r.demand-r.sales;});
  let pool=Math.round(0.5*R.reduce((s,r)=>s+r.lost,0));
  for(let k=0;k<3&&pool>0;k++){
    const open=R.filter(r=>r.avail-r.sales>0), sa=open.reduce((s,r)=>s+r.demand,0); if(!open.length||!sa) break;
    let given=0; open.forEach(r=>{const g=Math.min(r.avail-r.sales,Math.round(pool*r.demand/sa));r.sales+=g;r.extra=(r.extra||0)+g;given+=g;});
    if(!given) break; pool-=given;
  }
  const total=R.reduce((s,r)=>s+r.sales,0)||1, tE=R.reduce((s,r)=>s+r.d.eco,0), tP=R.reduce((s,r)=>s+r.d.prem,0);
  R.forEach(r=>{
    const c=r.c;
    c.debt+=r.loan; c.cash+=r.loan;
    const pooled=c.inv*c.avgCost+r.prod*r.uc, avg=r.avail?pooled/r.avail:r.uc;
    const revenue=r.sales*r.price, cogs=r.sales*avg, inv=r.avail-r.sales;
    const fixed=fixedCost(c), storage=CFG.storage*inv, interest=c.debt*CFG.rate*ev.rate;
    const initCost=r.buy.reduce((s,k)=>s+INIT[k].cost,0)+(r.research?CFG.research:0);
    let profit=revenue-cogs-fixed-r.mkt-r.rd-storage-interest-initCost;
    c.cash+=revenue-r.prod*r.uc-fixed-r.mkt-r.rd-storage-interest-initCost-r.newCap*CFG.capCost;
    let emergency=0;
    if(c.cash<0){emergency=Math.ceil(-c.cash/1000)*1000;const fee=emergency*CFG.penalty;c.debt+=emergency+fee;c.cash+=emergency;profit-=fee;}
    c.inv=inv; c.avgCost=avg; c.brand=r.brand;
    c.q=clamp(c.q-0.25+0.5*Math.sqrt(r.rd/50000),1,10);
    c.cap+=c.pendCap; c.pendCap=r.newCap;
    r.buy.forEach(k=>c.has[k]=true);
    const prev=c.hist[c.hist.length-1], avgProfit=prev?(profit+prev.profit)/2:profit;
    const equity=c.cash-c.debt+(c.cap+c.pendCap)*CFG.capValue+c.inv*c.avgCost*0.5;
    const value=equity+4*Math.max(0,avgProfit);
    c.hist.push({price:r.price,prod:r.prod,mkt:r.mkt,rd:r.rd,newCap:r.newCap,loan:r.loan,buy:r.buy,research:r.research,demand:r.demand,evDemand:ev.demand,sales:r.sales,lost:r.lost,extra:r.extra||0,
      share:r.sales/total,shE:r.d.eco/tE,shP:r.d.prem/tP,revenue,cogs,fixed,storage,interest,initCost,profit,emergency,cash:c.cash,debt:c.debt,inv,q:c.q,brand:c.brand,cap:c.cap,value,eventId:S.eventId});
  });
  S.round++; S.decs=[]; S.src=[]; S.deadline=0;
  if(S.round>S.rounds){S.phase='final';}
  else{const ids=Object.keys(EVENTS).filter(k=>k!=='calm'&&k!==S.eventId);S.eventId=Math.random()<0.25?'calm':ids[Math.floor(Math.random()*ids.length)];S.phase='results';}
}
/* код решения для передачи организатору без синхронизации */
function encodeDec(team,round,d){const fl=(d.buy||[]).map(k=>k[0]).join('')+(d.research?'r':'');return ['K'+(team+1),round,d.price,d.prod,d.mkt/1000,d.rd/1000,d.newCap,d.loan/1000,fl||'0'].join('.')}
function decodeDec(str){
  const p=String(str).trim().toUpperCase().replace(/\s+/g,'').replace(/^К/,'K').split('.'); if(p.length!==9||p[0][0]!=='K') return null;
  const n=p.slice(1,8).map(Number), team=+p[0].slice(1)-1; if(n.some(isNaN)||isNaN(team)) return null;
  const fl=p[8].toLowerCase(), buy=Object.keys(INIT).filter(k=>fl.includes(k[0]));
  return {team,round:n[0],d:{price:n[1],prod:n[2],mkt:n[3]*1000,rd:n[4]*1000,newCap:n[5],loan:n[6]*1000,buy,research:fl.includes('r')}};
}

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x))),m=x/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}
function drawChart(){
  const box=$('#chart'); if(!box) return;
  const ch=CHARTS[chartKey], n=G.cos[0].hist.length, W=680,H=260,L=64,Rr=16,T=12,B=28, tight=chartKey==='price'||chartKey==='q';

  const step=niceStep((hi-lo)/4), ticks=[]; for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step) ticks.push(v);
  const X=i=>n===1?(L+W-Rr)/2:L+(W-L-Rr)*i/(n-1), Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));

/* ---------- разбор ---------- */
function stratLabel(c){
  const mP=G.cos.reduce((s,x)=>s+avg(x,'price'),0)/G.cos.length, mQ=G.cos.reduce((s,x)=>s+x.q,0)/G.cos.length, rel=avg(c,'price')/mP;
  const ps=c.hist.map(h=>h.price), sd=Math.sqrt(ps.reduce((s,p)=>s+Math.pow(p-avg(c,'price'),2),0)/ps.length)/avg(c,'price');
  let l=rel<0.96?'Низкая цена':rel>1.04?(c.q>=mQ?'Премиум':'Дорого без опоры на качество'):'Середина рынка';
  if(sd>0.07) l+=', с резкими разворотами';
  return l;
}
function turning(c){
  const ds=c.hist.map((h,i)=>({i,d:h.value-(i?c.hist[i-1].value:startValue())}));
  const why=i=>{const h=c.hist[i],p=c.hist[i-1],a=[`«${EVENTS[h.eventId].t}»`];
    if(p&&Math.abs(h.price/p.price-1)>=0.05) a.push(`цена ${h.price>p.price?'поднята':'снижена'} на ${Math.round(Math.abs(h.price/p.price-1)*100)}%`);
    if(p&&Math.abs(h.share-p.share)>=0.03) a.push(`доля ${h.share>p.share?'выросла':'упала'} на ${q1(Math.abs(h.share-p.share)*100)} п.п.`);
    if(h.lost>50) a.push(`не хватило ${nf(h.lost)} шт`); if(h.inv>200) a.push(`на складе осталось ${nf(h.inv)} шт`);
    if(h.emergency) a.push('экстренный заём'); if(h.buy.length) a.push('запуск: '+h.buy.map(k=>INIT[k].n.toLowerCase()).join(', '));
    return a.join(' · ');};
  const best=[...ds].sort((a,b)=>b.d-a.d)[0], worst=[...ds].sort((a,b)=>a.d-b.d)[0];
  return {best:{q:best.i+1,d:best.d,why:why(best.i)},worst:{q:worst.i+1,d:worst.d,why:why(worst.i)}};
}
function mapSVG(){
  const pts=G.cos.map(c=>({c,x:avg(c,'price'),y:avg(c,'q'),s:sum(c,'sales')})), W=680,H=300,L=52,R=20,T=16,B=40;
  let x0=Math.min(...pts.map(p=>p.x))-25,x1=Math.max(...pts.map(p=>p.x))+25,y0=Math.min(...pts.map(p=>p.y))-0.4,y1=Math.max(...pts.map(p=>p.y))+0.4, ms=Math.max(...pts.map(p=>p.s));
  const X=v=>L+(W-L-R)*(v-x0)/(x1-x0), Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Карта позиционирования: средняя цена и среднее качество">`;
  const xs=niceStep((x1-x0)/5), ys=niceStep((y1-y0)/4);
  for(let v=Math.ceil(x0/xs)*xs;v<=x1;v+=xs) s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}" stroke="var(--line)"/><text x="${X(v)}" y="${H-B+16}" text-anchor="middle">$${nf(v)}</text>`;
  for(let v=Math.ceil(y0/ys)*ys;v<=y1;v+=ys) s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${q1(v)}</text>`;
  s+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle">средняя цена за игру →</text><text x="12" y="${T+4}" transform="rotate(-90 12 ${T+4})" text-anchor="end">качество →</text>`;
  pts.forEach(p=>{const r=8+10*Math.sqrt(p.s/ms), right=X(p.x)<W-140;
    s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${r}" fill="${col(p.c)}" stroke="var(--surface)" stroke-width="2"><title>${esc(p.c.name)}: $${nf(p.x)}, качество ${q1(p.y)}, продано ${nf(p.s)}</title></circle>
    <text x="${X(p.x)+(right?r+6:-r-6)}" y="${Y(p.y)+4}" text-anchor="${right?'start':'end'}" style="fill:var(--ink);font:600 12px var(--body)">${esc(p.c.name)}</text>`;});
  return s+`</svg>`;
}

    body=`<div class="panel"><h3>Кто где стоял на рынке</h3><p class="small muted">Положение круга: средняя цена и среднее качество за игру. Размер: сколько самокатов продано.</p><div class="chart">${mapSVG()}</div>
      <div class="tw"><table><thead><tr><th>Компания</th><th>Стратегия по факту</th><th>Ср. цена</th><th>Маркетинг</th><th>Разработки</th><th>Доля «Эконом»</th><th>Доля «Премиум»</th><th>Инициативы</th></tr></thead><tbody>
      ${order.map(c=>`<tr><td><span class="nmc">${dot(c)}${esc(c.name)}</span></td><td style="font-family:var(--body);white-space:normal;min-width:150px;text-align:left">${stratLabel(c)}</td><td>$${nf(avg(c,'price'))}</td><td>${money(sum(c,'mkt'))}</td><td>${money(sum(c,'rd'))}</td><td>${pct(avg(c,'shE'))}</td><td>${pct(avg(c,'shP'))}</td><td style="font-family:var(--body)">${Object.keys(c.has).map(k=>INIT[k].n).join(', ')||'нет'}</td></tr>`).join('')}</tbody></table></div></div>
      ${qbox('Вопрос залу',['Совпадает ли «стратегия по факту» с тем, что команда задумывала в первом квартале?','Кто оказался в одной точке карты с соперником? Чем это закончилось для обоих?','Какой сегмент остался недооценённым и почему туда никто не пошёл?'])}`;
  }else if(ui.tab===2){
    body=`<div class="panel"><h3>Лучший и худший квартал каждой команды</h3>${humans.map(c=>{const t=turning(c);return `<div class="quote"><b style="display:flex;gap:8px;align-items:center">${dot(c)}${esc(c.name)}</b>
      <span><span class="up num">▲ К${t.best.q}: ${t.best.d>=0?'+':'−'}${money(Math.abs(t.best.d)).replace('−','')}</span> · ${t.best.why}</span>
      <span><span class="down num">▼ К${t.worst.q}: ${t.worst.d>=0?'+':'−'}${money(Math.abs(t.worst.d)).replace('−','')}</span> · ${t.worst.why}</span></div>`}).join('')}</div>${chartBlock()}
      ${qbox('Вопрос залу',['Что в худшем квартале было вашим решением, а что действием конкурентов или новостью?','Какую информацию вы имели перед этим решением и чем из неё не воспользовались?'])}`;
  }else if(ui.tab===3){
    body=`<div class="panel"><h3>Сколько стоили ошибки планирования</h3><div class="tw"><table><thead><tr><th>Компания</th><th>Не хватило товара</th><th>Упущенная выручка</th><th>Хранение</th><th>Проценты</th><th>Штрафы банка</th><th>Прибыль за игру</th></tr></thead><tbody>
      ${order.map(c=>`<tr><td><span class="nmc">${dot(c)}${esc(c.name)}</span></td><td>${nf(sum(c,'lost'))} шт</td><td>${money(c.hist.reduce((s,h)=>s+h.lost*h.price,0))}</td><td>${money(sum(c,'storage'))}</td><td>${money(sum(c,'interest'))}</td><td>${money(sum(c,'emergency')*CFG.penalty)}</td><td class="${sum(c,'profit')<0?'down':''}">${money(sum(c,'profit'))}</td></tr>`).join('')}</tbody></table></div>
      <p class="small muted">Упущенная выручка посчитана по цене того квартала, в котором товара не хватило.</p></div>
      ${qbox('Вопрос залу',['Что обошлось дороже: лишний товар на складе или покупатели, которым товара не хватило?','Как вы оценивали спрос перед тем, как назначить выпуск? Кто покупал прогноз и помог ли он?','Кто брал кредит заранее, а кто получил экстренный заём? В чём разница в подходе?'])}`;
  }else if(ui.tab===4){
    body=`<div class="panel"><h3>Ответы команд</h3><p class="small muted">Команды отвечают на два вопроса на своих устройствах. Если связи нет, дайте каждой команде минуту и выслушайте ответы вслух.</p>
      ${humans.map(c=>{const r=refl[c.ci];return `<div class="quote"><b style="display:flex;gap:8px;align-items:center">${dot(c)}${esc(c.name)}</b>${r?`<span><span class="muted">Наша стратегия:</span> ${esc(r.a1||'—')}</span><span><span class="muted">Сделали бы иначе:</span> ${esc(r.a2||'—')}</span>`:'<span class="muted">Ответа пока нет</span>'}</div>`}).join('')}</div>
      ${qbox('Вопрос залу',['Как команда принимала решения: кто предлагал, кто считал, кто решал при споре?','Успевали ли вы за таймером? От чего отказались, когда времени не хватало?'])}`;
  }else{
    body=`<div class="panel"><h2>От игры к работе</h2><div class="rules">
      <div><h3>1. Что произошло</h3><span>Восстановите ход игры фактами: кто лидировал, где случился перелом, какие новости изменили рынок.</span></div>
      <div><h3>2. Почему так вышло</h3><span>Какие решения привели к результату? Что зависело от вас, а что от соперников?</span></div>
      <div><h3>3. Где это есть у нас</h3><span>Какие ситуации из игры вы узнаёте в своей работе, продуктах, отношениях с клиентами?</span></div>
      <div><h3>4. Что сделаем иначе</h3><span>Одно действие, которое каждый участник попробует в ближайший месяц.</span></div></div></div>
      <div class="panel"><h3>Что показала модель</h3><ul class="plain">
      <li><b>Позиция важнее отдельного решения.</b> Компания между сегментами проигрывает в обоих: для «Эконома» она дорогая, для «Премиума» недостаточно хорошая.</li>
      <li><b>Вложения работают с задержкой.</b> Качество и инициативы окупаются через несколько кварталов, поэтому поздние вложения не успевают вернуться.</li>
      <li><b>Цена действует быстрее всего, и на соперников тоже.</b> Снижение цены легко повторить, преимущество в качестве и бренде повторить долго.</li>
      <li><b>Прибыль и деньги в кассе не одно и то же.</b> Прибыльная компания может получить кассовый разрыв, если вложит всё в выпуск и мощности.</li>
      <li><b>Результат зависит от чужих решений.</b> Тот же план даёт разный итог в зависимости от того, что сделали конкуренты.</li></ul>
      <div class="row-btn"><button type="button" id="again">Завершить и создать новую игру</button></div></div>`;
  }
  app.innerHTML=`<div class="wrap" style="padding:0;gap:20px">
    <div class="hero" style="padding-block:4px"><span class="eyebrow">Игра ${G.code} окончена · разбор, шаг ${ui.tab+1} из ${TABS.length}</span><h1>${ui.tab===0?'Победитель: '+esc(w.name):TABS[ui.tab]}</h1></div>
    <div class="seg" id="tabs">${TABS.map((t,i)=>`<button type="button" data-i="${i}" aria-pressed="${ui.tab===i}">${i+1}. ${t}</button>`).join('')}</div>
    ${body}
    <div class="row-btn">${ui.tab>0?'<button type="button" id="prev">Назад</button>':''}${ui.tab<TABS.length-1?`<button class="primary" type="button" id="nextt">Дальше: ${TABS[ui.tab+1]}</button>`:''}</div></div>`;
  drawChart();
  $('#tabs').onclick=e=>{const i=e.target.dataset.i;if(i!=null){ui.tab=+i;render();}};
  if($('#prev'))$('#prev').onclick=()=>{ui.tab--;render();}; if($('#nextt'))$('#nextt').onclick=()=>{ui.tab++;render();};
  if($('#again'))$('#again').onclick=()=>{G=null;ls.set('konk2-org',null);stopSubs();ui.tab=0;render();};
}

/* ---------- участник ---------- */
async function loadGames(){
  ui.games='load';
  try{const s=await db.collection('games').orderBy('ts','desc').limit(8).get();ui.games=s.docs.map(d=>d.data()).filter(x=>x&&x.v===2&&Date.now()-x.ts<36*3600*1000);}catch(e){ui.games=[];}
  if(role==='team'&&!G)render();
}
function teamJoin(){
  if(ui.offline) return teamOffline();
  if(dbState==='wait'){app.innerHTML=`<div class="panel center"><p class="muted">Ищем игру…</p></div>`;return;}
  if(dbState==='on'&&ui.games==null) loadGames();
  const list=Array.isArray(ui.games)?ui.games:[];
  app.innerHTML=`<div class="wrap" style="padding:0;gap:20px">
    <div class="hero" style="padding-block:4px"><span class="eyebrow">Участник</span><h1>Выберите игру и команду</h1></div>
    ${dbState==='off'?`<div class="banner">На этом устройстве нет связи с игрой: войдите в Claude под учётной записью, которой открыт доступ к странице. Без входа можно заполнить бланк решений и передать организатору код.</div>`
      :ui.games==='load'?`<div class="panel"><p class="muted">Загружаем список игр…</p></div>`
      :list.length?list.map(g=>`<div class="panel"><div class="top"><div><span class="eyebrow">Игра</span><div class="code">${esc(g.code)}</div></div><span class="chip">${g.phase==='final'?'окончена':'квартал '+Math.min(g.round,g.rounds)+' из '+g.rounds}</span></div>
        <div class="teams">${g.cos.filter(c=>c.human).map(c=>`<button type="button" class="jn" data-code="${esc(g.code)}" data-t="${c.ci}" style="display:flex;gap:8px;align-items:center">${dot(c)}${esc(c.name)}</button>`).join('')}</div></div>`).join('')
      :`<div class="panel"><p>Игр пока нет. Организатор должен создать игру на своём экране.</p><div class="row-btn"><button type="button" id="reload">Обновить список</button></div></div>`}
    <div class="row-btn"><button type="button" id="off">Заполнить бланк без связи</button></div></div>`;
  document.querySelectorAll('.jn').forEach(b=>b.onclick=()=>{ui.team=+b.dataset.t;ls.set('konk2-team',{code:b.dataset.code,team:ui.team});G=list.find(g=>g.code===b.dataset.code);teamSubscribe(b.dataset.code);render();});
  if($('#reload'))$('#reload').onclick=()=>{ui.games=null;render();};
  $('#off').onclick=()=>{ui.offline={team:0,round:1,code:null};render();};
}
function teamOffline(){
  const o=ui.offline;
  if(o.code){app.innerHTML=`<div class="panel center"><span class="eyebrow">Команда ${o.team+1} · квартал ${o.round}</span><p>Продиктуйте или отправьте организатору этот код:</p><div class="code" style="font-size:clamp(18px,5vw,30px);letter-spacing:.04em;word-break:break-all">${o.code}</div>
    <div class="row-btn"><button class="primary" type="button" id="nx">Следующий квартал</button><button type="button" id="bk">Исправить</button></div></div>`;
    $('#nx').onclick=()=>{o.round++;o.code=null;render();};$('#bk').onclick=()=>{o.code=null;render();};return;}
  const d=o.d||(o.d=lastDec({hist:[]}));
  const F=[['price','Цена самоката, $',300,700,5],['prod','Произвести, шт',0,3000,10],['mkt','Маркетинг, $ тыс.',0,200,5,1000],['rd','Разработки, $ тыс.',0,150,5,1000],['newCap','Купить мощности, шт',0,600,50],['loan','Кредит, $ тыс. (минус = погасить)',-500,500,10,1000]];
  app.innerHTML=`<form class="panel" id="form" autocomplete="off"><div class="top"><h2>Бланк решений</h2><button type="button" id="back">К списку игр</button></div>
    <p class="small muted">Цифры своей компании смотрите на экране организатора. Он проверит ограничения при вводе кода.</p>
    <div class="setup-grid"><div><label class="small muted" for="ot">Номер команды</label><input type="text" inputmode="numeric" id="ot" value="${o.team+1}"></div><div><label class="small muted" for="or">Квартал</label><input type="text" inputmode="numeric" id="or" value="${o.round}"></div></div>
    ${F.map(f=>`<div class="field"><div class="hd"><label for="f-${f[0]}">${f[1]}</label><output id="o-${f[0]}"></output></div><input type="range" id="f-${f[0]}" min="${f[2]}" max="${f[3]}" step="${f[4]}" value="${d[f[0]]/(f[5]||1)}"></div>`).join('')}
    <div class="inits">${Object.keys(INIT).map(k=>`<label><input type="checkbox" id="b-${k}" ${d.buy.includes(k)?'checked':''}><span><b>${INIT[k].n} · ${money(INIT[k].cost)}</b><br><span class="small muted">${INIT[k].d}</span></span></label>`).join('')}</div>
    <div class="row-btn"><button class="primary" type="submit">Получить код</button></div></form>`;
  const upd=()=>F.forEach(f=>{const v=+$('#f-'+f[0]).value;d[f[0]]=v*(f[5]||1);$('#o-'+f[0]).textContent=nf(v);});
  $('#form').oninput=upd;upd();
  $('#back').onclick=()=>{ui.offline=null;render();};
  $('#form').onsubmit=e=>{e.preventDefault();upd();d.buy=Object.keys(INIT).filter(k=>$('#b-'+k).checked);o.team=clamp((+$('#ot').value||1)-1,0,7);o.round=clamp(+$('#or').value||1,1,12);o.code=encodeDec(o.team,o.round,d);render();};
}
function teamView(){
  const c=G.cos[ui.team]; if(!c||!c.human){ls.set('konk2-team',null);G=null;return teamJoin();}
  const key=G.code+':'+G.round;
  if(G.phase==='decide'){
    if(ui.sent[key]&&!ui.editing){
      const d=ui.sent[key];
      app.innerHTML=`<div class="wrap" style="padding:0;gap:20px">${tickerHTML()}${eventHTML()}<div class="panel center" style="padding-block:28px">
        <span class="eyebrow">${qLabel()} · ${esc(c.name)}</span><h2>${ui.codeFor===key?'Передайте код организатору':'Решения отправлены'}</h2>${timerHTML()}
        ${ui.codeFor===key?`<p class="muted">Это устройство может только смотреть игру. Продиктуйте код:</p><div class="code" style="font-size:clamp(18px,5vw,30px);letter-spacing:.04em;word-break:break-all">${encodeDec(ui.team,G.round,d)}</div>`
          :`<p class="muted">Цена $${d.price} · выпуск ${nf(d.prod)} шт · маркетинг ${money(d.mkt)} · разработки ${money(d.rd)}</p><p class="muted">Ждём, пока организатор закроет квартал.</p>`}
        <button type="button" id="edit">Изменить решения</button></div></div>`;
      $('#edit').onclick=()=>{ui.editing=true;ui.draft=JSON.parse(JSON.stringify(d));render();};
      return;
    }
    return decisionForm(ui.team,{submit:'Отправить решения',onSubmit:d=>{ui.sent[key]=d;ui.editing=false;ui.codeFor=null;render();
      db.doc(`games/${G.code}/dec/r${G.round}t${ui.team}`).set({round:G.round,team:ui.team,d,at:Date.now()}).catch(()=>{ui.codeFor=key;render();});}});
  }
  ui.editing=false;
  if(G.phase==='results'){
    app.innerHTML=`<div class="wrap" style="padding:0;gap:20px">${tickerHTML()}
      <div><span class="eyebrow">Итоги квартала ${G.round-1} из ${G.rounds}</span><h2 style="margin-top:6px">${esc(c.name)}: результаты</h2></div>
      ${reportHTML(c,true)}<div class="panel"><h3>Кто забрал покупателей</h3>${sharesHTML()}${marketTable(true)}</div>${chartBlock()}
      <p class="muted">Следующий квартал откроет организатор.</p></div>`;
    return drawChart();
  }
  const order=[...G.cos].sort((a,b)=>lastVal(b)-lastVal(a)), place=order.indexOf(c)+1, t=turning(c), sentR=ui.sent[G.code+':refl'];
  app.innerHTML=`<div class="wrap" style="padding:0;gap:20px">${tickerHTML()}
    <div class="hero" style="padding-block:4px"><span class="eyebrow">Игра окончена · ${esc(c.name)}</span><h1>${place} место из ${G.cos.length}</h1></div>
    <div class="panel"><div class="stats">
      <div class="stat"><span class="k">Стоимость</span><span class="val">${money(lastVal(c))}</span></div><div class="stat"><span class="k">Прибыль за игру</span><span class="val">${money(sum(c,'profit'))}</span></div>
      <div class="stat"><span class="k">Средняя цена</span><span class="val">$${nf(avg(c,'price'))}</span></div><div class="stat"><span class="k">Не хватило товара</span><span class="val">${nf(sum(c,'lost'))} шт</span></div></div>
      <p><b>Стратегия по факту:</b> ${stratLabel(c)}.</p>
      <div class="quote"><span><span class="up num">▲ Лучший квартал К${t.best.q}</span> · ${t.best.why}</span><span><span class="down num">▼ Худший квартал К${t.worst.q}</span> · ${t.worst.why}</span></div></div>
    <form class="panel" id="rf"><h2>Два вопроса к разбору</h2>
      <div><label for="a1"><b>Какой была ваша стратегия?</b></label><textarea id="a1" maxlength="300" ${sentR?'disabled':''}>${esc(sentR?sentR.a1:'')}</textarea></div>
      <div><label for="a2"><b>Что вы сделали бы иначе?</b></label><textarea id="a2" maxlength="300" ${sentR?'disabled':''}>${esc(sentR?sentR.a2:'')}</textarea></div>
      <div class="row-btn"><button class="primary" type="submit" ${sentR?'disabled':''}>${sentR?'Ответ отправлен':'Отправить организатору'}</button><span class="small" id="rmsg"></span></div></form>
    ${chartBlock()}</div>`;
  drawChart();
  $('#rf').onsubmit=e=>{e.preventDefault();const x={team:ui.team,a1:$('#a1').value.trim(),a2:$('#a2').value.trim(),at:Date.now()};
    db.doc(`games/${G.code}/refl/t${ui.team}`).set(x).then(()=>{ui.sent[G.code+':refl']=x;render();}).catch(()=>{$('#rmsg').textContent='Отправить не получилось. Расскажите ответ вслух на разборе.';$('#rmsg').className='small down';});};
}

/* ---------- каркас ---------- */
function render(){
  const chip=$('#rolechip'); chip.hidden=!role; chip.textContent=role==='org'?'организатор':role==='team'?'участник':'';
  $('#btn-new').hidden=!role;
  if(!role) viewLanding();
  else if(role==='org'){ if(!G) orgSetup(); else ({decide:orgDecide,results:orgResults,final:orgFinal})[G.phase](); }
  else { if(!G||ui.team==null) teamJoin(); else teamView(); }
  if(!$('#form')||!ui.keepScroll) window.scrollTo(0,0);
}
$('#rules-body').innerHTML=rulesHTML();
$('#btn-rules').onclick=()=>$('#dlg-rules').showModal();
$('#btn-rules-close').onclick=()=>$('#dlg-rules').close();
$('#btn-new').onclick=()=>{
  $('#dlg-new-h').textContent=role==='org'&&G?'Завершить игру?':'Выйти на первый экран?';
  $('#dlg-new-p').textContent=role==='org'&&G?'Текущая партия будет стёрта на этом экране. Участники останутся на последнем состоянии.':role==='team'?'Вы сможете снова выбрать игру и команду.':'';
  $('#dlg-new').showModal();};
$('#btn-new-no').onclick=()=>$('#dlg-new').close();
$('#btn-new-yes').onclick=()=>{$('#dlg-new').close();stopSubs();
  if(role==='org'&&G){G=null;ls.set('konk2-org',null);render();return;}
  if(role==='team')ls.set('konk2-team',null);
  G=null;ui.team=null;ui.offline=null;ui.games=null;role=null;try{location.hash=''}catch(e){}render();};

const h0=(location.hash||'').replace('#','');
if(h0==='org'||h0==='team') setRole(h0); else render();
initDb();
</script>
</body></html>
