<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';
import { OBJECTS } from './objects.js';

const params = new URLSearchParams(location.search);
const name = params.get('obj') || 'envelope';
const hue = params.get('hue') || 'magenta';
const SIZE = +(params.get('size') || 1100);

const PAL = {
  magenta: { base: 0xb414f5, deep: 0x4a0e90, l1: 0xff28e0, l2: 0x7a3dff, l3: 0xfff0ff, dark: 0x1c1626, amb: 0x0a0312 },
  green:   { base: 0x22e05a, deep: 0x0c6a34, l1: 0x4cff6a, l2: 0x00c8a0, l3: 0xf0fff4, dark: 0x141f18, amb: 0x030a05 },
};
const P = PAL[hue];

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ---------- studio environment: HDR equirect made of soft gaussian light boxes ----------
function makeEnvTex() {
  const W = 512, H = 256, data = new Float32Array(W * H * 4);
  const c = (hex, k) => { const col = new THREE.Color(hex); return [col.r * k, col.g * k, col.b * k]; };
  // lon/lat in degrees, sigma in degrees
  const L = [
    { lon: 0, lat: 66, sl: 50, sa: 8, c: c(P.l3, 9) },      // top strip (front)
    { lon: 180, lat: 60, sl: 70, sa: 10, c: c(P.l1, 5) },   // top strip (back)
    { lon: -75, lat: 8, sl: 10, sa: 34, c: c(P.l1, 9) },    // left softbox
    { lon: 70, lat: 15, sl: 11, sa: 34, c: c(P.l2, 8) },    // right softbox
    { lon: 28, lat: 30, sl: 5, sa: 26, c: c(P.l3, 10) },    // thin key strip
    { lon: -30, lat: -8, sl: 4, sa: 30, c: c(P.l1, 7) },    // thin fill strip
    { lon: 0, lat: -58, sl: 70, sa: 8, c: c(P.l1, 2.2) },  // floor glow
    { lon: 140, lat: 0, sl: 12, sa: 36, c: c(P.l2, 5) },    // back right
    { lon: -140, lat: 5, sl: 11, sa: 36, c: c(P.l1, 5) },   // back left
  ];
  const amb = c(P.amb, 1);
  for (let y = 0; y < H; y++) {
    const lat = 90 - (y + 0.5) / H * 180;
    for (let x = 0; x < W; x++) {
      const lon = (x + 0.5) / W * 360 - 180;
      let r = amb[0], g = amb[1], b = amb[2];
      for (const l of L) {
        let dl = Math.abs(lon - l.lon); if (dl > 180) dl = 360 - dl;
        const da = lat - l.lat;
        const w = Math.exp(-0.5 * ((dl / l.sl) ** 2 + (da / l.sa) ** 2));
        r += l.c[0] * w; g += l.c[1] * w; b += l.c[2] * w;
      }
      const i = ((H - 1 - y) * W + x) * 4;
      data[i] = r; data[i + 1] = g; data[i + 2] = b; data[i + 3] = 1;
    }
  }
  const t = new THREE.DataTexture(data, W, H, THREE.RGBAFormat, THREE.FloatType);
  t.mapping = THREE.EquirectangularReflectionMapping; t.colorSpace = THREE.LinearSRGBColorSpace;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromEquirectangular(makeEnvTex()).texture;

const scene = new THREE.Scene();
scene.environment = envTex;

const cam = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
cam.position.set(0, 0.6, 11.5);
cam.lookAt(0, 0, 0);

const MAT = {
  chrome: new THREE.MeshPhysicalMaterial({ color: P.base, metalness: 1.0, roughness: 0.14, clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 1.0 }),
  deep: new THREE.MeshPhysicalMaterial({ color: P.deep, metalness: 1.0, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.08, envMapIntensity: 1.0 }),
  dark: new THREE.MeshPhysicalMaterial({ color: P.dark, metalness: 0.9, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.18, envMapIntensity: 0.9 }),
  glow: new THREE.MeshPhysicalMaterial({ color: P.l1, metalness: 0.3, roughness: 0.22, emissive: new THREE.Color(P.l1), emissiveIntensity: 0.75, clearcoat: 1, envMapIntensity: 0.8 }),
  white: new THREE.MeshPhysicalMaterial({ color: 0xf6ecff, metalness: 0.15, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.1, envMapIntensity: 0.9 }),
  facet: new THREE.MeshPhysicalMaterial({ color: P.base, metalness: 1.0, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.0, flatShading: true }),
};


const root = new THREE.Group();
scene.add(root);
OBJECTS[name]({ THREE, RoundedBoxGeometry, BGU, ConvexGeometry, MAT, root, P });
// auto-fit: centre the object and scale it into the frame
root.updateMatrixWorld(true);
const bb = new THREE.Box3().setFromObject(root);
const ctr = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3());
const k = 4.7 / Math.max(sz.x, sz.y);
const fit = new THREE.Group(); scene.remove(root); fit.add(root); scene.add(fit);
root.position.sub(ctr); fit.scale.setScalar(k);

renderer.render(scene, cam);
window.__done = true;
</script></body></html>
