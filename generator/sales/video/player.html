<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../course/css/style.css">
<style>
  html,body{width:1280px;height:720px;overflow:hidden;background:#020d09}
  body{font-size:22px}
  #v{position:absolute;inset:0;width:1280px;height:720px;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%,#07281d 0%,#020d09 62%)}
  /* фон без blur-фильтров — быстрее рендерится покадрово */
  .g{position:absolute;border-radius:50%;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
  .g1{width:820px;height:820px;left:-260px;top:-360px;background:radial-gradient(closest-side,rgba(16,185,129,.42),transparent);animation:m1 26s infinite alternate ease-in-out}
  .g2{width:700px;height:700px;right:-220px;top:40px;background:radial-gradient(closest-side,rgba(52,211,153,.24),transparent);animation:m2 31s infinite alternate ease-in-out}
  .g3{width:900px;height:900px;left:300px;bottom:-620px;background:radial-gradient(closest-side,rgba(76,234,76,.2),transparent);animation:m3 37s infinite alternate ease-in-out}
  @keyframes m1{to{transform:translate(260px,180px) scale(1.2)}}
  @keyframes m2{to{transform:translate(-300px,120px) scale(.85)}}
  @keyframes m3{to{transform:translate(-240px,-140px) scale(1.15)}}
  .vb{position:absolute;left:0;right:0;bottom:0;height:560px;display:flex;align-items:flex-end}
  .vb i{flex:1;height:100%;transform-origin:bottom;transform:scaleY(var(--h));
    background:linear-gradient(to top,rgba(76,234,140,.5) 0%,rgba(16,185,129,.26) 26%,rgba(6,78,59,.1) 60%,transparent 100%);
    border-left:1px solid rgba(110,231,183,.05);animation:bar var(--d) ease-in-out var(--dl) infinite alternate}
  .shade{position:absolute;inset:0;background:radial-gradient(90% 75% at 50% 42%,transparent 35%,rgba(1,8,6,.78) 100%)}
  .lg{position:absolute;right:56px;top:40px;height:40px}
  .sc{position:absolute;inset:0;padding:48px 64px 0;display:none}
  .kk{font-family:var(--head);font-weight:600;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--e300);display:flex;align-items:center;gap:12px}
  .kk::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 14px var(--lime)}
  .sc h1{font-family:var(--head);font-weight:600;text-transform:uppercase;letter-spacing:-.02em;line-height:1.04;font-size:62px;margin-top:30px;max-width:880px}
  .sc h1.xl{font-size:84px}
  .sc h1.wide{max-width:1150px}
  .sub{font-size:29px;color:#cfe3da;margin-top:18px;max-width:760px;line-height:1.4}
  .a{animation:in .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--t,0)*1s)}
  @keyframes in{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  .pp{animation:pop .6s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--t,0)*1s)}
  @keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
  .dim{animation:dim .6s both;animation-delay:calc(var(--t,0)*1s)}
  @keyframes dim{to{opacity:.28;filter:grayscale(1)}}
  .lit{animation:lit .6s both;animation-delay:calc(var(--t,0)*1s)}
  @keyframes lit{to{background:linear-gradient(180deg,rgba(52,211,153,.5),rgba(16,185,129,.2));border-color:rgba(110,231,183,.9);transform:translateY(-8px)}}
  .who{position:absolute;right:50px;bottom:112px;width:370px;filter:drop-shadow(0 24px 40px rgba(0,0,0,.5))}
  .who.sm{width:300px}
  .row{display:flex;gap:20px;margin-top:44px;flex-wrap:nowrap;align-items:stretch}
  .tile{position:relative;background:rgba(255,255,255,.055);border:1.5px solid rgba(255,255,255,.12);border-radius:22px;padding:26px 30px;min-width:190px}
  .tile b{display:block;font-family:var(--head);font-weight:600;font-size:30px;line-height:1.15}
  .tile span{display:block;font-size:19px;color:#c4d9cf;margin-top:8px;line-height:1.35}
  .tile .n{font-family:var(--head);font-weight:600;font-size:52px;line-height:1;margin-bottom:12px;
    background:linear-gradient(180deg,var(--e200),var(--e500));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tile.c{padding:18px 22px;min-width:0}
  .tile.c b{font-size:24px}
  .tile.c .n{font-size:42px;margin-bottom:8px}
  .tile.w b{max-width:215px}
  .tile.brk::before{inset:-9px;--s:24px;--w:2.5px}
  .big{font-family:var(--head);font-weight:600;font-size:250px;line-height:.8;letter-spacing:-.06em;position:absolute;left:58px;top:200px;
    background:linear-gradient(180deg,var(--e200) 0%,var(--e500) 50%,rgba(6,78,59,.2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stepbox{position:absolute;left:400px;top:196px;width:560px}
  .stepbox h1{margin-top:0;font-size:64px}
  .stepbox ul{margin-top:26px}
  .stepbox li{position:relative;padding:14px 0 14px 46px;font-size:28px;color:#dcece5;border-bottom:1px solid rgba(255,255,255,.1);line-height:1.3}
  .stepbox li::before{content:"+";position:absolute;left:4px;top:4px;font-family:var(--head);font-weight:300;font-size:34px;color:var(--e400)}
  .bub{background:#f1f8f4;color:#0a2e22;border-radius:26px 26px 26px 6px;padding:20px 28px;font-size:30px;line-height:1.3;font-weight:500;display:inline-block;max-width:760px;box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
  .bub.r{border-radius:26px 26px 6px 26px}
  .nomt{margin-top:6px !important}
  .spin{display:flex;gap:12px;margin-top:34px}
  .spin i{width:74px;height:74px;border-radius:18px;display:grid;place-items:center;font-style:normal;font-family:var(--head);font-weight:600;font-size:38px;color:rgba(255,255,255,.4);border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)}
  .spin i.on{color:#02130d;background:linear-gradient(180deg,var(--e300),var(--e500));border-color:transparent;box-shadow:0 10px 40px -8px rgba(16,185,129,.9)}
  .chipsv{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px;max-width:800px}
  .chipsv span{padding:11px 20px;border-radius:999px;border:1.5px solid rgba(110,231,183,.35);background:rgba(16,185,129,.12);font-size:21px;font-family:var(--head);font-weight:600}
  .hl2{background:linear-gradient(90deg,var(--e300),var(--e500) 55%,var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
  .prog7{position:absolute;left:64px;bottom:128px;display:flex;gap:10px;align-items:flex-end;height:60px}
  .prog7 i{width:34px;border-radius:5px 5px 0 0;background:rgba(255,255,255,.12);height:calc(18px + var(--k)*6px)}
  .prog7 i.on{background:linear-gradient(to top,var(--e600),var(--e300))}
  .ph{position:absolute;left:64px;top:300px;width:340px;height:262px;border-radius:30px;border:2px solid rgba(255,255,255,.18);background:rgba(2,13,9,.7);padding:22px}
  .ph div{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.07);margin-bottom:12px;font-size:20px}
  .ph div b{color:var(--e300);font-family:var(--head)}
  .circ{width:230px;height:230px;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--head);font-weight:600;font-size:26px;line-height:1.15;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
  .circ.on{border-color:var(--e300);background:radial-gradient(closest-side,rgba(52,211,153,.5),rgba(16,185,129,.12));box-shadow:0 0 80px rgba(16,185,129,.5)}
  .arrow{font-family:var(--head);font-weight:300;font-size:70px;color:var(--e300);align-self:center}
  #cap{position:absolute;left:90px;right:90px;bottom:34px;min-height:62px;display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:23px;line-height:1.3;color:#fff;font-weight:500;padding:10px 26px;border-radius:16px;background:rgba(2,13,9,.72);border:1px solid rgba(255,255,255,.1)}
  #bar{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--e600),var(--e300));width:0}
</style>
</head>
<body>
<div id="v">
  <div class="g g1"></div><div class="g g2"></div><div class="g g3"></div>
  <div class="vb" id="vb"></div><div class="shade"></div>
  <img class="lg" src="../course/img/logo-dark.png" alt="">
  <div id="scenes"></div>
  <div id="cap"></div><div id="bar"></div>
</div>
<script src="scenes.js"></script>
<script src="timings.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('v') || 'v1';
  var V = window.VIDEOS[id], T = window.TIMINGS[id];
  var vb = document.getElementById('vb'), h = '';
  for (var i = 0; i < 16; i++) {
    var a = Math.abs((Math.sin(i * 12.9898) * 43758.5453) % 1), b = Math.abs((Math.sin(i * 78.233) * 12543.123) % 1), e = Math.abs(i - 7.5) / 7.5;
    h += '<i style="--h:' + (.1 + e * .55 + a * .2).toFixed(2) + ';--h2:' + Math.min(1, .1 + e * .55 + a * .2 + .12 + b * .3).toFixed(2) + ';--d:' + (5 + a * 6).toFixed(1) + 's;--dl:-' + (b * 9).toFixed(1) + 's"></i>';
  }
  vb.innerHTML = h;
  var host = document.getElementById('scenes'), cap = document.getElementById('cap'), bar = document.getElementById('bar');
  var scenes = V.scenes.map(function (s, k) {
    var el = document.createElement('div'); el.className = 'sc';
    var start = T.cuts[k], end = T.cuts[k + 1], dur = end - start;
    el.innerHTML = '<div class="kk a">' + V.kicker + '</div>' + s.html;
    // data-f: момент появления как доля длительности сцены
    Array.prototype.forEach.call(el.querySelectorAll('[data-f]'), function (n) { n.style.setProperty('--t', (parseFloat(n.dataset.f) * dur).toFixed(2)); });
    host.appendChild(el);
    // субтитры: предложения делят время сцены пропорционально длине
    var total = s.cap.reduce(function (a, c) { return a + c.length; }, 0), acc = 0;
    var caps = s.cap.map(function (c) { var o = { t: start + dur * acc / total, text: c }; acc += c.length; return o; });
    return { el: el, start: start, end: end, caps: caps };
  });
  var bg = null;
  window.TOTAL = T.total;
  window.seek = function (t) {
    var c = '';
    scenes.forEach(function (s) {
      var on = t >= s.start && t < s.end;
      s.el.style.display = on ? 'block' : 'none';
      if (!on) return;
      var l = t - s.start;
      s.el.style.opacity = Math.max(0, Math.min(1, l / .3, (s.end - t) / .3));
      s.el.getAnimations({ subtree: true }).forEach(function (a) { a.pause(); a.currentTime = l * 1000; });
      s.caps.forEach(function (x) { if (t >= x.t) c = x.text; });
    });
    if (!bg) bg = [].concat(Array.prototype.slice.call(document.querySelectorAll('.g,.vb i')).map(function (n) { return n.getAnimations(); })).reduce(function (a, b) { return a.concat(b); }, []);
    bg.forEach(function (a) { a.pause(); a.currentTime = t * 1000; });
    cap.textContent = c; cap.style.visibility = c ? 'visible' : 'hidden';
    bar.style.width = (t / T.total * 100) + '%';
  };
  document.fonts.ready.then(function () { window.READY = true; window.seek(0); });
})();
</script>
</body>
</html>
