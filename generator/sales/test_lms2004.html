<!DOCTYPE html><html><head><meta charset="utf-8"><title>LMS stub 2004</title></head>
<body style="margin:0">
<script>
/* Заглушка LMS для локальной проверки SCORM 2004: журналирует все вызовы API_1484_11 */
window.LOG = []; window.DATA = { 'cmi.completion_status': 'unknown', 'cmi.success_status': 'unknown', 'cmi.suspend_data': '', 'cmi.location': '' };
window.API_1484_11 = {
  Initialize: function () { LOG.push('Initialize'); return 'true'; },
  Terminate: function () { LOG.push('Finish'); return 'true'; },
  GetValue: function (k) { return DATA[k] || ''; },
  SetValue: function (k, v) { DATA[k] = String(v); LOG.push('Set ' + k + '=' + String(v).slice(0, 60)); return 'true'; },
  Commit: function () { return 'true'; },
  GetLastError: function () { return '0'; }, GetErrorString: function () { return ''; }, GetDiagnostic: function () { return ''; }
};
</script>

</body></html>
